<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JavaScript DOM Manipulation 15</title><style>body{font-family:Arial,sans-serif}.demo{padding:20px}.card{padding:20px;border:1px solid #ccc;border-radius:10px;margin:10px 0}.btn{padding:10px 16px;border:0;border-radius:6px;cursor:pointer;margin:5px}.input{padding:10px;border:1px solid #aaa;border-radius:6px}.output{margin-top:12px;padding:10px;background:#f3f4f6;border-radius:6px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #ccc;padding:10px;text-align:left}th{background:#f3f4f6}.highlight{background:#dbeafe!important;border:2px solid #2563eb!important;color:#1e3a8a!important}.slide{height:220px;border-radius:12px;display:grid;place-items:center;background:#e0f2fe;font-size:32px;font-weight:bold}</style><link rel="stylesheet" href="../../shared/enhancements.css"></head><body><main class="wrap"><nav class="topbar"><a href="../index.html">← JavaScript</a><a href="../../index.html">Home</a></nav><section class="question"><div class="eyebrow">DOM Manipulation • Experiment 15</div><h1>Create an image slideshow/carousel using JavaScript.</h1><p>Working demonstration based on the practical question.</p></section><section class="preview"><h2>Interactive Preview</h2><div class="demo"><div id="slide" class="slide">Slide 1</div><div style="text-align:center"><button id="prev" class="btn">← Previous</button><button id="next" class="btn">Next →</button></div><p id="slideNumber" class="output" style="text-align:center">Slide 1 of 4</p></div></section></main><script src="../../shared/search-index.js"></script><script src="../../shared/enhancements.js"></script><script>const slides=[{title:'HTML',text:'Structure of a webpage'},{title:'CSS',text:'Style of a webpage'},{title:'JavaScript',text:'Add interactivity'},{title:'DOM',text:'Manipulate webpage elements'}];let current=0;const slide=document.getElementById('slide'),number=document.getElementById('slideNumber');function showSlide(){slide.innerHTML='<strong>'+slides[current].title+'</strong><br><small>'+slides[current].text+'</small>';number.textContent='Slide '+(current+1)+' of '+slides.length;}document.getElementById('next').addEventListener('click',()=>{current=(current+1)%slides.length;showSlide();});document.getElementById('prev').addEventListener('click',()=>{current=(current-1+slides.length)%slides.length;showSlide();});showSlide();</script></body></html>
