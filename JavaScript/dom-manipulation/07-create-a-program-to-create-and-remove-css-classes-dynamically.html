<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JavaScript DOM Manipulation 7</title><style>body{font-family:Arial,sans-serif}.demo{padding:20px}.card{padding:20px;border:1px solid #ccc;border-radius:10px;margin:10px 0}.btn{padding:10px 16px;border:0;border-radius:6px;cursor:pointer;margin:5px}.input{padding:10px;border:1px solid #aaa;border-radius:6px}.output{margin-top:12px;padding:10px;background:#f3f4f6;border-radius:6px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #ccc;padding:10px;text-align:left}th{background:#f3f4f6}.highlight{background:#dbeafe!important;border:2px solid #2563eb!important;color:#1e3a8a!important}.slide{height:220px;border-radius:12px;display:grid;place-items:center;background:#e0f2fe;font-size:32px;font-weight:bold}</style><link rel="stylesheet" href="../../shared/enhancements.css"></head><body><main class="wrap"><nav class="topbar"><a href="../index.html">← JavaScript</a><a href="../../index.html">Home</a></nav><section class="question"><div class="eyebrow">DOM Manipulation • Experiment 7</div><h1>Create a program to create and remove CSS classes dynamically.</h1><p>Working demonstration based on the practical question.</p></section><section class="preview"><h2>Interactive Preview</h2><div class="demo"><div id="classBox" class="card">CSS class demonstration</div><button id="addClass" class="btn">Add Class</button><button id="removeClass" class="btn">Remove Class</button></div></section></main><script src="../../shared/search-index.js"></script><script src="../../shared/enhancements.js"></script><script>const box=document.getElementById('classBox');document.getElementById('addClass').addEventListener('click',()=>box.classList.add('highlight'));document.getElementById('removeClass').addEventListener('click',()=>box.classList.remove('highlight'));</script></body></html>
