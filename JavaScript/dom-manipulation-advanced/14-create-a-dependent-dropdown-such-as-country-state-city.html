<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JavaScript DOM Manipulation 14</title><style>body{font-family:Arial,sans-serif}.demo{padding:20px}.card{padding:20px;border:1px solid #ccc;border-radius:10px;margin:10px 0}.btn{padding:10px 16px;border:0;border-radius:6px;cursor:pointer;margin:5px}.input{padding:10px;border:1px solid #aaa;border-radius:6px}.output{margin-top:12px;padding:10px;background:#f3f4f6;border-radius:6px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #ccc;padding:10px;text-align:left}th{background:#f3f4f6}.highlight{background:#dbeafe!important;border:2px solid #2563eb!important;color:#1e3a8a!important}.slide{height:220px;border-radius:12px;display:grid;place-items:center;background:#e0f2fe;font-size:32px;font-weight:bold}</style><link rel="stylesheet" href="../../shared/enhancements.css"></head><body><main class="wrap"><nav class="topbar"><a href="../index.html">← JavaScript</a><a href="../../index.html">Home</a></nav><section class="question"><div class="eyebrow">DOM Manipulation • Experiment 14</div><h1>Create a dependent dropdown such as Country → State → City.</h1><p>Working demonstration based on the practical question.</p></section><section class="preview"><h2>Interactive Preview</h2><div class="demo"><select id="country" class="input"><option value="">Select Country</option><option value="India">India</option><option value="USA">USA</option></select><select id="state" class="input"><option value="">Select State</option></select><select id="city" class="input"><option value="">Select City</option></select></div></section></main><script src="../../shared/search-index.js"></script><script src="../../shared/enhancements.js"></script><script>const data={India:{TamilNadu:['Chennai','Coimbatore','Madurai'],AndhraPradesh:['Kadapa','Tirupati','Vijayawada']},USA:{California:['Los Angeles','San Diego'],Texas:['Dallas','Austin']}};const country=document.getElementById('country'),state=document.getElementById('state'),city=document.getElementById('city');function resetSelect(el,text){el.innerHTML='';const opt=document.createElement('option');opt.value='';opt.textContent=text;el.appendChild(opt);}country.addEventListener('change',()=>{resetSelect(state,'Select State');resetSelect(city,'Select City');if(!country.value)return;Object.keys(data[country.value]).forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;state.appendChild(o);});});state.addEventListener('change',()=>{resetSelect(city,'Select City');if(!country.value||!state.value)return;data[country.value][state.value].forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;city.appendChild(o);});});</script></body></html>
