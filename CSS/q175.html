<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML model performance dashboard — CSS Practical 175</title>
<link rel="stylesheet" href="../assets/theme.css">
<style>

.demo-form{max-width:380px;display:grid;gap:14px;}
.demo-form label{font-size:.85em;color:var(--muted);}
.demo-form input,.demo-form textarea{width:100%;padding:10px 12px;background:var(--panel);border:1px solid var(--border);
  border-radius:8px;color:var(--text);}
.demo-form input:focus,.demo-form textarea:focus{outline:none;border-color:var(--accent);}
.demo-form .field{display:grid;gap:6px;}
.demo-form .error{color:#e2432f;font-size:.8em;}
.demo-form button{background:var(--accent);color:#111;font-weight:800;border:none;padding:12px;border-radius:8px;cursor:pointer;}

</style>
</head>
<body>
<header class="site">
  <div class="brand">MEGANADH<span>.LAB</span></div>
  <nav class="crumb">
    <a href="../index.html">Home</a>
    <a href="index.html">CSS Programs</a>
  </nav>
</header>
<main>
  <span class="tag">CSS Practical 175</span>
  <h1 class="page-title">ML model performance dashboard<span class="dot">.</span></h1>
  <p class="desc">A CSS practical exploring: ml model performance dashboard.</p>
  <div class="panel">

    <form class="demo-form" onsubmit="return false;">
      <div class="field"><label>Full name</label><input type="text" placeholder="Jane Doe"></div>
      <div class="field"><label>Email</label><input type="email" placeholder="jane@company.com"><span class="error">Please enter a valid email</span></div>
      <div class="field"><label>Password</label><input type="password" placeholder="••••••••"></div>
      <div class="field"><label>Message</label><textarea rows="3" placeholder="How can we help?"></textarea></div>
      <button type="submit">Submit</button>
    </form>

  </div>
</main>
<footer class="site">B. Meganadh Reddy · 250200531 · Sec 6</footer>

</html>
