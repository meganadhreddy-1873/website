<link rel="stylesheet" href="../assets/theme.css">
<style>

.flex-demo{display:flex;gap:12px;flex-wrap:wrap;}
.flex-demo div{flex:1 1 140px;background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center;}
.grid-demo{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media (max-width:600px){.grid-demo{grid-template-columns:repeat(2,1fr);}}
.grid-demo div{background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;padding:20px;text-align:center;}
.sticky-demo header{position:sticky;top:0;background:var(--bg-soft);padding:10px;border:1px solid var(--border);border-radius:8px;}

</style>
</head>

  <div class="panel">

    <div class="flex-demo"><div>Flex 1</div><div>Flex 2</div><div>Flex 3</div></div><br>
    <div class="grid-demo"><div>1</div><div>2</div><div>3</div><div>4</div></div><br>
