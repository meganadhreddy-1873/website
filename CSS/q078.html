<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress bar component — CSS Practical 078</title>
<link rel="stylesheet" href="../assets/theme.css">
<style>

.progress{height:10px;background:var(--panel);border-radius:20px;overflow:hidden;}
.progress > div{height:100%;background:linear-gradient(90deg,var(--teal),var(--accent));width:65%;}
.steps{display:flex;justify-content:space-between;}
.steps .step{flex:1;text-align:center;position:relative;color:var(--muted);}
.steps .step.done{color:var(--accent);}
.steps .step::before{content:'';display:block;width:26px;height:26px;border-radius:50%;background:var(--panel);border:2px solid var(--border);
  margin:0 auto 6px;}
.steps .step.done::before{background:var(--accent);border-color:var(--accent);}
.timeline{border-left:2px solid var(--border);padding-left:18px;}
.timeline .event{margin-bottom:18px;position:relative;}
.timeline .event::before{content:'';position:absolute;left:-24px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent);}

</style>
</head>
<body>
<header class="site">
  <div class="brand">MEGANADH<span>.LAB</span></div>
  <nav class="crumb">
    <a href="../index.html">Home</a>
    <a href="index.html">CSS Programs</a>
  </nav>
</header>
<main>
  <span class="tag">CSS Practical 078</span>
  <h1 class="page-title">Progress bar component<span class="dot">.</span></h1>
  <p class="desc">A CSS practical exploring: progress bar component.</p>
  <div class="panel">

    <div class="progress"><div></div></div><br>
    <div class="steps"><div class="step done">Cart</div><div class="step done">Shipping</div><div class="step">Payment</div><div class="step">Done</div></div><br>
    <div class="timeline">
      <div class="event"><b>Order placed</b><div style="color:var(--muted)">Sep 20, 10:02 AM</div></div>
      <div class="event"><b>Payment confirmed</b><div style="color:var(--muted)">Sep 20, 10:05 AM</div></div>
      <div class="event"><b>Shipped</b><div style="color:var(--muted)">Sep 21, 09:00 AM</div></div>
    </div>

  </div>
</main>
<footer class="site">B. Meganadh Reddy · 250200531 · Sec 6</footer>
</body>
</html>
