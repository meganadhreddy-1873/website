<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales analytics dashboard — CSS Practical 094</title>
<link rel="stylesheet" href="../assets/theme.css">
<style>

.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:20px;}
.kpi{background:var(--bg-soft);border:1px solid var(--border);border-radius:12px;padding:18px;}
.kpi .val{font-size:1.6em;font-weight:800;}
.kpi .delta{color:var(--teal);font-size:.8em;}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px;border-bottom:1px solid var(--border);padding-top:10px;}
.bars div{flex:1;background:linear-gradient(180deg,var(--accent),var(--teal));border-radius:4px 4px 0 0;}
.donut{width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--accent) 0 40%,var(--teal) 40% 70%,var(--border) 70% 100%);
  display:flex;align-items:center;justify-content:center;}
.donut span{background:var(--bg);width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;}

</style>
</head>
<body>
<header class="site">
  <div class="brand">MEGANADH<span>.LAB</span></div>
  <nav class="crumb">
    <a href="../index.html">Home</a>
    <a href="index.html">CSS Programs</a>
  </nav>
</header>
<main>
  <span class="tag">CSS Practical 094</span>
  <h1 class="page-title">Sales analytics dashboard<span class="dot">.</span></h1>
  <p class="desc">A CSS practical exploring: sales analytics dashboard.</p>
  <div class="panel">

    <div class="dash-grid">
      <div class="kpi"><div style="color:var(--muted)">MRR</div><div class="val">$48.2k</div><div class="delta">▲ 12.4%</div></div>
      <div class="kpi"><div style="color:var(--muted)">Active Users</div><div class="val">3,204</div><div class="delta">▲ 4.1%</div></div>
      <div class="kpi"><div style="color:var(--muted)">Churn</div><div class="val">1.8%</div><div class="delta">▼ 0.3%</div></div>
    </div>
    <div class="bars">
      <div style="height:40%"></div><div style="height:70%"></div><div style="height:55%"></div><div style="height:90%"></div>
      <div style="height:65%"></div><div style="height:80%"></div><div style="height:50%"></div>
    </div>
    <br><div class="donut"><span>70%</span></div>

  </div>
</main>
<footer class="site">B. Meganadh Reddy · 250200531 · Sec 6</footer>
</body>
</html>
