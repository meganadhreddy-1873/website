<main>
  <span class="tag">HTML Practical 13</span>
  <h1 class="page-title">Responsive Webpage (Media Queries)<span class="dot">.</span></h1>
  <p class="desc">Layout adapts to the viewport width.</p>
  <div class="panel">

    <style>
      .rgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
      .rgrid div{ background:#1b1b1b; border:1px solid var(--border); padding:20px; text-align:center; border-radius:8px;}
      @media (max-width:700px){
        .rgrid{ grid-template-columns:1fr; }
        .rgrid div{ background:#232323; }
      }
    </style>
    <div class="rgrid"><div>Box 1</div><div>Box 2</div><div>Box 3</div></div>
    <p class="desc">Resize the browser below 700px width to see the grid collapse to a single column.</p>

  </div>
