<main>
  <span class="tag">HTML Practical 05</span>
  <h1 class="page-title">Student Registration Form<span class="dot">.</span></h1>
  <p class="desc">A form built using HTML form elements.</p>
  <div class="panel">

    <form onsubmit="alert('Form submitted (demo only)'); return false;">
      <label>Full Name</label><input type="text" placeholder="Your name" required>
      <label>Email</label><input type="email" placeholder="you@example.com" required>
      <label>Gender</label>
      <div><input type="radio" name="g" id="m"><label for="m" style="display:inline">Male</label>
      <input type="radio" name="g" id="f"><label for="f" style="display:inline">Female</label></div>
      <label>Course</label>
      <select><option>B.Tech CSE</option><option>B.Tech ECE</option><option>B.Tech IT</option></select>
      <label>Address</label><textarea rows="3" placeholder="Your address"></textarea>
      <label><input type="checkbox"> I agree to the terms</label>
      <br><br><button class="btn" type="submit">Register</button>
    </form>

  </div>
</main>
