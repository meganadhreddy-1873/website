  <p class="desc">email, date, number, password inputs.</p>
  <div class="panel">

    <form>
      <label>Email</label><input type="email" placeholder="you@example.com">
      <label>Date of Birth</label><input type="date">
      <label>Age</label><input type="number" min="1" max="100">
      <label>Password</label><input type="password" placeholder="••••••••">
      <label>Favourite Colour</label><input type="color">
      <label>Range</label><input type="range" min="0" max="100">
    </form>

  </div>
